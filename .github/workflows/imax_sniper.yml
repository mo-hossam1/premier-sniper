name: Premiere IMAX Ticket Sniper

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test_movie:
        description: 'Movie name to test right now (e.g. Street Fighter or Dune)'
        required: false
        default: 'Dune'

jobs:
  scan-imax:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install playwright requests beautifulsoup4
          playwright install chromium --with-deps

      - name: Check Live Cinema Feeds
        env:
          TARGET_MOVIE: ${{ github.event.inputs.test_movie || 'Dune' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'zayed_imax_sniper_4821' }}
        run: |
          python - << 'EOF'
          import os
          import re
          import requests
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          movie = os.environ["TARGET_MOVIE"].strip()
          topic = os.environ["NTFY_TOPIC"].strip()
          pattern = re.compile(re.escape(movie), re.IGNORECASE)

          elcinema_url = "https://elcinema.com/en/theater/3101134/"
          premiere_branch_url = "https://www.premiere-cinemas.com/en/cinemas/2"
          premiere_now_showing = "https://www.premiere-cinemas.com/now-showing"

          def notify(source, url):
              requests.post(
                  f"https://ntfy.sh/{topic}",
                  data=f"TICKETS LIVE: '{movie}' is open for booking on {source}!".encode("utf-8"),
                  headers={
                      "Title": f"IMAX DROP: {movie}",
                      "Priority": "urgent",
                      "Tags": "rotating_light,ticket",
                      "Click": url
                  },
                  timeout=10
              )
              print(f"[ALERT SENT] Match found on {source}")

          # 1. Check Elcinema IMAX Hall (Per-Movie Block, Not Full Page)
          try:
              res = requests.get(elcinema_url, headers={"User-Agent": "Mozilla/5.0"}, timeout=15)
              if res.status_code == 200:
                  soup = BeautifulSoup(res.text, "html.parser")
                  # Each movie in a theater page sits inside its own row/container
                  for row in soup.select(".row, .theater-movie, .boxed-category"):
                      text = row.get_text(" ", strip=True)
                      if pattern.search(text) and ("egp" in text.lower() or "pm" in text.lower() or "am" in text.lower()):
                          notify("Elcinema Premiere IMAX", elcinema_url)
                          raise SystemExit(0)
          except Exception as e:
              print(f"Elcinema check error: {e}")

          # 2. Check Premiere Cinemas Official Site
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              for label, url in [
                  ("Premiere Cinemas (Americana Plaza Page)", premiere_branch_url),
                  ("Premiere Cinemas (Now Showing / Pre-book)", premiere_now_showing),
              ]:
                  try:
                      page.goto(url, wait_until="domcontentloaded", timeout=30000)
                      page.wait_for_timeout(4000)
                      body_text = page.inner_text("body")
                      
                      # Cut off any "Coming Soon" section at the bottom so we don't alert early
                      active_section = re.split(r"coming\s+soon", body_text, flags=re.IGNORECASE)[0]
                      
                      if pattern.search(active_section):
                          notify(label, url)
                          browser.close()
                          raise SystemExit(0)
                  except Exception as e:
                      print(f"Error checking {label}: {e}")

              browser.close()

          print(f"Checked all feeds. '{movie}' is not open for booking yet.")
          EOF
